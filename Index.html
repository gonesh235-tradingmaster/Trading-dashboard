<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>আমার ট্রেডিং ড্যাশবোর্ড</title>
  <style>
    body {
      margin: 0;
      background: #0e1117;
      color: #e6e6e6;
      font-family: Arial, sans-serif;
    }
    header {
      padding: 16px;
      text-align: center;
      background: #161b22;
      border-bottom: 1px solid #30363d;
    }
    h1 { margin: 0 0 8px; font-size: 24px; }
    header p { margin: 0; color: #8b949e; }
    .container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(360px, 1fr));
      gap: 16px;
      padding: 16px;
    }
    .card {
      background: #161b22;
      border-radius: 12px;
      padding: 8px;
      height: 500px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      border: 1px solid #30363d;
    }
    .card h2 {
      font-size: 16px;
      margin: 4px 8px 8px;
      color: #58a6ff;
    }
    .widget { flex: 1; min-height: 0; }
    .ticker-card { height: 110px; }
    .ticker { height: 80px; }
    .tradingview-widget-container { height: 100%; width: 100%; }
    @media (max-width: 600px) {
      .container { grid-template-columns: 1fr; }
      .card { height: 420px; }
      .ticker-card { height: 110px; }
    }
  </style>
</head>
<body>

<header>
  <h1>আমার ট্রেডিং ড্যাশবোর্ড</h1>
  <p>সব তথ্য এক জায়গায় — API ছাড়াই</p>
</header>

<div class="container">

  <!-- টিকার -->
  <div class="card ticker-card">
    <h2>টিকার</h2>
    <div class="widget ticker">
      <div class="tradingview-widget-container">
        <div class="tradingview-widget-container__widget"></div>
        <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-ticker-tape.js" async>
        {
          "symbols": [
            {"proName": "FOREXCOM:SPXUSD", "title": "S&P 500"},
            {"proName": "FOREXCOM:NSXUSD", "title": "Nasdaq 100"},
            {"proName": "FX_IDC:EURUSD", "title": "EUR/USD"},
            {"proName": "BITSTAMP:BTCUSD", "title": "Bitcoin"},
            {"proName": "BITSTAMP:ETHUSD", "title": "Ethereum"},
            {"proName": "OANDA:XAUUSD", "title": "Gold"}
          ],
          "showSymbolLogo": true,
          "colorTheme": "dark",
          "isTransparent": false,
          "displayMode": "adaptive",
          "locale": "en"
        }
        </script>
      </div>
    </div>
  </div>

  <!-- চার্ট -->
  <div class="card">
    <h2>চার্ট</h2>
    <div class="widget">
      <div class="tradingview-widget-container">
        <div class="tradingview-widget-container__widget"></div>
        <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-advanced-chart.js" async>
        {
          "autosize": true,
          "symbol": "OANDA:XAUUSD",
          "interval": "60",
          "timezone": "Asia/Dhaka",
          "theme": "dark",
          "style": "1",
          "locale": "en",
          "withdateranges": true,
          "hide_side_toolbar": false,
          "allow_symbol_change": true,
          "details": true,
          "hotlist": true,
          "calendar": true,
          "studies": ["RSI@tv-basicstudies", "MASimple@tv-basicstudies"],
          "support_host": "https://www.tradingview.com"
        }
        </script>
      </div>
    </div>
  </div>

  <!-- মার্কেট ওভারভিউ -->
  <div class="card">
    <h2>মার্কেট ওভারভিউ</h2>
    <div class="widget">
      <div class="tradingview-widget-container">
        <div class="tradingview-widget-container__widget"></div>
        <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-market-overview.js" async>
        {
          "colorTheme": "dark",
          "dateRange": "12M",
          "showChart": true,
          "locale": "en",
          "width": "100%",
          "height": "100%",
          "isTransparent": false,
          "showSymbolLogo": true,
          "showFloatingTooltip": false,
          "plotLineColorGrowing": "rgba(41, 98, 255, 1)",
          "plotLineColorFalling": "rgba(255, 0, 0, 1)",
          "gridLineColor": "rgba(42, 46, 57, 0)",
          "scaleFontColor": "rgba(219, 219, 219, 1)",
          "belowLineFillColorGrowing": "rgba(41, 98, 255, 0.12)",
          "belowLineFillColorFalling": "rgba(255, 0, 0, 0.12)",
          "belowLineFillColorGrowingBottom": "rgba(41, 98, 255, 0)",
          "belowLineFillColorFallingBottom": "rgba(255, 0, 0, 0)",
          "symbolActiveColor": "rgba(41, 98, 255, 0.12)",
          "tabs": [
            {
              "title": "Indices",
              "symbols": [
                {"s": "FOREXCOM:SPXUSD", "d": "S&P 500"},
                {"s": "FOREXCOM:NSXUSD", "d": "Nasdaq 100"},
                {"s": "FOREXCOM:DJI", "d": "Dow Jones"},
                {"s": "INDEX:NKY", "d": "Nikkei 225"},
                {"s": "INDEX:DEU40", "d": "DAX"},
                {"s": "FOREXCOM:UKXGBP", "d": "FTSE 100"}
              ],
              "originalTitle": "Indices"
            },
            {
              "title": "Forex",
              "symbols": [
                {"s": "FX_IDC:EURUSD", "d": "EUR/USD"},
                {"s": "FX_IDC:USDJPY", "d": "USD/JPY"},
                {"s": "FX_IDC:GBPUSD", "d": "GBP/USD"},
                {"s": "FX_IDC:AUDUSD", "d": "AUD/USD"},
                {"s": "FX_IDC:USDCAD", "d": "USD/CAD"}
              ],
              "originalTitle": "Forex"
            },
            {
              "title": "Crypto",
              "symbols": [
                {"s": "BITSTAMP:BTCUSD", "d": "Bitcoin"},
                {"s": "BITSTAMP:ETHUSD", "d": "Ethereum"},
                {"s": "BINANCE:SOLUSDT", "d": "Solana"},
                {"s": "BINANCE:XRPUSDT", "d": "XRP"}
              ],
              "originalTitle": "Crypto"
            }
          ]
        }
        </script>
      </div>
    </div>
  </div>

  <!-- RSS নিউজ -->
  <div class="card">
    <h2>ট্রেডিং নিউজ (অটো আপডেট)</h2>
    <div class="widget" style="overflow-y:auto; padding:0 8px;">
      <div id="news-list" style="font-size:14px; line-height:1.5;">
        লোড হচ্ছে...
      </div>
      <div id="news-updated" style="color:#8b949e; font-size:12px; padding:6px 0;"></div>
    </div>
  </div>

  <!-- ইকোনমিক ক্যালেন্ডার -->
  <div class="card">
    <h2>ইকোনমিক ক্যালেন্ডার</h2>
    <div class="widget">
      <div class="tradingview-widget-container">
        <div class="tradingview-widget-container__widget"></div>
        <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-events.js" async>
        {
          "colorTheme": "dark",
          "isTransparent": false,
          "width": "100%",
          "height": "100%",
          "locale": "en",
          "importanceFilter": "-1,0,1",
          "countryFilter": "us,eu,gb,jp,cn,in"
        }
        </script>
      </div>
    </div>
  </div>

  <!-- স্ক্রিনার -->
  <div class="card">
    <h2>স্ক্রিনার</h2>
    <div class="widget">
      <div class="tradingview-widget-container">
        <div class="tradingview-widget-container__widget"></div>
        <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-screener.js" async>
        {
          "defaultColumn": "overview",
          "defaultScreen": "general",
          "market": "forex",
          "showToolbar": true,
          "colorTheme": "dark",
          "locale": "en",
          "width": "100%",
          "height": "100%"
        }
        </script>
      </div>
    </div>
  </div>

</div>

<script>
async function loadNews() {
  try {
    const res = await fetch("news.json?v=" + Date.now());
    const data = await res.json();
    const list = document.getElementById("news-list");

    if (!data.items || data.items.length === 0) {
      list.innerHTML = "কোনো নিউজ পাওয়া যায়নি।";
      return;
    }

    const html = data.items.map(n => {
      const time = n.ts ? new Date(n.ts * 1000).toLocaleString("bn-BD", {
        day: "2-digit", month: "short", hour: "2-digit", minute: "2-digit"
      }) : "";
      return `
        <div style="padding:10px 6px; border-bottom:1px solid #30363d;">
          <a href="${n.link}" target="_blank" rel="noopener"
             style="color:#58a6ff; text-decoration:none; font-weight:600;">
            ${n.title}
          </a>
          <div style="color:#8b949e; font-size:12px; margin-top:4px;">
            ${n.source} • ${time}
          </div>
        </div>
      `;
    }).join("");

    list.innerHTML = html;
    document.getElementById("news-updated").textContent =
      "সর্বশেষ আপডেট: " + new Date(data.updated).toLocaleString("bn-BD");

  } catch (e) {
    document.getElementById("news-list").innerHTML =
      "নিউজ লোড করতে সমস্যা হচ্ছে। (news.json ফাইল তৈরি হয়েছে কিনা চেক করুন)";
  }
}

loadNews();
setInterval(loadNews, 5 * 60 * 1000);
</script>

</body>
</html>
